<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2eb" />
    <title>Zoetrope</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <meta name="description" content="A zoetrope on a turntable, drawn in hairline strokes, a horse at a gallop on its strip. Hover and a motor spins it; at speed the slots strobe and the horse runs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f4f2eb; --ink: #292922; --muted: #76766b; --accent: #bc422c; --rule: #deddd3;
        /* Hairline's inks, on David's page colour */
        --hl-hi: #232327; --hl-edge: #a4a4ac; --hl-mid: #c3c3c9; --hl-lo: #e0e0e4; --hl-sw: 0.9;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #131311; --ink: #eceae1; --muted: #8b8a80; --accent: #e0674f; --rule: #2a2a26; --hl-hi: #d0d6e0; --hl-edge: #5b5d64; --hl-mid: #3e3e44; --hl-lo: #29292d;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --paper: #131311; --ink: #eceae1; --muted: #8b8a80; --accent: #e0674f; --rule: #2a2a26; --hl-hi: #d0d6e0; --hl-edge: #5b5d64; --hl-mid: #3e3e44; --hl-lo: #29292d;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; }
      body { overflow: hidden; transition: background .4s cubic-bezier(.32,.72,0,1), color .4s cubic-bezier(.32,.72,0,1); }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      #stage { position: fixed; left: 0; right: 0; top: 64px; width: 100vw; height: calc(100dvh - 200px); display: block; touch-action: none; cursor: grab; outline: none; }
      #stage.dragging { cursor: grabbing; }
      #stage:focus-visible { outline: 1.5px solid var(--hl-hi); outline-offset: -4px; }
      /* the drawing, as Hairline paints it: plates filled with the ground, one stroke width */
      #stage path { fill: var(--paper); stroke: var(--hl-mid); stroke-width: var(--hl-sw); vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; transition: stroke 260ms cubic-bezier(.5, 0, .1, 1); }
      #stage .sil { stroke: var(--hl-edge); }
      #stage .sil.ui { stroke: var(--hl-mid); }
      #stage .cr { fill: none; stroke: var(--hl-lo); }
      #stage .fill { fill: var(--hl-lo); stroke: none; }
      #stage .mk { fill: none; stroke: var(--hl-mid); }
      #stage .lo { stroke: var(--hl-lo); }
      #stage .nf { fill: none; }
      #stage .plate { stroke: none; }
      #stage .wall { stroke: none; fill-rule: evenodd; }
      #stage .slot { stroke: var(--hl-lo); }
      #stage .slot-edge { fill: none; stroke: var(--hl-mid); }
      #stage .horse { fill: var(--hl-edge); stroke: none; }
      #stage .rim { stroke: var(--hl-edge); fill-rule: evenodd; }
      #stage .dot { fill: var(--hl-mid); stroke: none; }
      #stage .hi, #stage .sil.ui.hi { stroke: var(--hl-hi); }
      #stage .fill.hi { stroke: var(--hl-hi); }
      #stage .guide { fill: none; stroke: var(--hl-mid); stroke-dasharray: 0.7 2.1; }
      header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; padding-block: calc(22px + env(safe-area-inset-top, 0px)) 0; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); pointer-events: none; }
      header h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -.2px; }
      header span { font-size: 10px; color: var(--muted); }
      .bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
      .readout { font-size: 10px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .readout b { font-weight: 500; color: var(--ink); }
      .idea { margin: 0 0 8px; text-align: center; font-size: 13px; color: var(--ink); padding: 0 16px; max-width: 520px; text-wrap: balance; }
      .controls { pointer-events: auto; align-self: stretch; display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; padding-block: 16px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--rule); font-size: 10px; color: var(--muted); }
      .controls label { display: flex; align-items: center; gap: 8px; }
      .controls input[type=range] { width: 92px; accent-color: var(--accent); }
      .controls button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--rule); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
      .controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 10px; color: var(--muted); pointer-events: none; }
      .credit { position: fixed; right: max(28px, env(safe-area-inset-right, 0px)); top: calc(44px + env(safe-area-inset-top, 0px)); font-size: 9px; color: var(--muted); pointer-events: none; }
      @media (max-width: 600px) {
        header { padding-block: calc(18px + env(safe-area-inset-top, 0px)) 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
        .credit { right: max(16px, env(safe-area-inset-right, 0px)); }
        .idea { font-size: 12px; }
        .controls { gap: 12px 16px; }
        .controls input[type=range] { width: 72px; }
      }
    </style>
  </head>
  <body>
    <svg id="stage" role="img" aria-label="A zoetrope on a turntable, drawn in thin lines, with a horse at a gallop on the strip inside. Hover or tap to run its motor; at speed the horse gallops. Space starts and stops it; drag sideways, swipe, or use left and right arrows to turn it by hand." tabindex="0" preserveAspectRatio="xMidYMid meet"></svg>
    <header>
      <h1>Zoetrope</h1>
      <span class="mono">Motion · 01</span>
    </header>
        <div class="bottom">
    <div class="readout mono" id="readout" aria-live="off">θ 000° · face <b>1</b>/4 · rest</div>
    <p class="idea">Twelve frames of a horse round a drum. Spin it and the slots become a shutter: each frame stands where the last one stood, and it runs.</p>
    <div class="controls mono">
      <label>Speed <input id="speed" type="range" min="0" max="1" step="0.01" value="0.57" /></label>
      <label>Stroke <input id="stroke" type="range" min="0.6" max="2" step="0.05" value="0.9" /></label>
      <button id="slow" aria-pressed="false">Slow 0.25×</button>
      <button id="theme" aria-pressed="false">Dark</button>
    </div>
    </div>
    <script type="module" src="./src/zoetrope/main.js"></script>
  </body>
</html>
